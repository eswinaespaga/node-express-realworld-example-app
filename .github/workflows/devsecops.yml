name: DevSecOps Quality Gate

on:
  push:
    branches:
      - main
      - master
      - laboratorio-rbac
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
  name: Secret Scanning - Gitleaks
  runs-on: ubuntu-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create lab Gitleaks rule
      run: |
        cat > .gitleaks.toml <<'EOF'
        [extend]
        useDefault = true

        [[rules]]
        id = "lab-demo-secret"
        description = "Laboratory secret marker for CI/CD evidence"
        regex = '''LAB_SECRET_[A-Z0-9]{20}'''
        tags = ["key", "lab"]
        EOF

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_CONFIG: .gitleaks.toml

  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            returntocorp/semgrep:latest \
            semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --exclude .github \
            --exclude Dockerfile \
            --error \
            /src

  trivy:
    name: SCA - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: node_modules
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "library"
          severity: "HIGH,CRITICAL"

  build:
    name: Build - Node and Nx
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - semgrep
      - trivy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build